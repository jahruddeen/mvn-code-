            -ErrorAction SilentlyContinue

          foreach ($connection in $connections) {

            $process = Get-Process `
              -Id $connection.OwningProcess `
              -ErrorAction SilentlyContinue

            if ($process) {
              Write-Host "Stopping Production process PID: $($process.Id)"
              Stop-Process `
                -Id $process.Id `
