            Select-Object -First 1

          if (-not $jar) {
            throw "QA JAR not found in $jarPath"
          }

          Write-Host "JAR: $($jar.FullName)"

          # Stop application using port 8082
          $connections = Get-NetTCPConnection `
            -LocalPort 8082 `
            -State Listen `
            -ErrorAction SilentlyContinue

          foreach ($connection in $connections) {

            $process = Get-Process `
              -Id $connection.OwningProcess `
              -ErrorAction SilentlyContinue

            if ($process) {
              Write-Host "Stopping QA process PID: $($process.Id)"
              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }

          Start-Sleep -Seconds 3

          # Copy new JAR
          Copy-Item `
            $jar.FullName `
            "$deployPath\application.jar" `
            -Force

          Write-Host "Starting QA application..."

          Start-Process `
            -FilePath "java.exe" `
            -ArgumentList @(
              "-jar",
              "$deployPath\application.jar",
              "--server.port=8082"
            ) `
            -WorkingDirectory $deployPath

          Start-Sleep -Seconds 15

      # ----------------------------------------------------------
      # QA Health Check
      # ----------------------------------------------------------

      - name: Health check QA
        shell: powershell
        run: |

          $url = "http://localhost:8082"

          try {

            $response = Invoke-WebRequest `
              -Uri $url `
              -UseBasicParsing `
              -TimeoutSec 20

            Write-Host "QA HTTP Status: $($response.StatusCode)"

            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
              throw "QA returned HTTP status $($response.StatusCode)"
            }

          }
          catch {

            Write-Error "QA health check failed."
            Write-Error $_
            exit 1
          }


  # ============================================================
  # PRODUCTION DEPLOYMENT
  # ============================================================

  deploy-production:

    name: Deploy Production

    needs: deploy-qa

    runs-on: [self-hosted, windows, x64]

    environment:
      name: production

    steps:

      # ----------------------------------------------------------
      # Download Artifact
      # ----------------------------------------------------------

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: C:\Deploy\Prod

      # ----------------------------------------------------------
      # Deploy Production
      # ----------------------------------------------------------

      - name: Deploy Production application
        shell: powershell
        run: |

          $deployPath = "C:\Apps\Prod"
          $jarPath = "C:\Deploy\Prod"

          Write-Host "Preparing Production deployment..."

          New-Item `
            -ItemType Directory `
            -Path $deployPath `
            -Force | Out-Null

          $jar = Get-ChildItem `
            -Path $jarPath `
            -Filter "*.jar" `
            -File |
            Select-Object -First 1

          if (-not $jar) {
            throw "Production JAR not found in $jarPath"
          }

          Write-Host "JAR: $($jar.FullName)"

          # Stop application using port 8083
          $connections = Get-NetTCPConnection `
            -LocalPort 8083 `
