```yaml
name: Java Maven CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:

  # =========================
  # BUILD
  # =========================
  build:
    name: Build Java Maven Application
    runs-on: [self-hosted, windows, x64]

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java
        shell: powershell
        run: |
          java -version
          Write-Host "JAVA_HOME = $env:JAVA_HOME"

      - name: Verify Maven Project
        shell: powershell
        run: |
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host "`nFiles:"
          Get-ChildItem $env:GITHUB_WORKSPACE

          Write-Host "`nSearching for pom.xml..."
          $pom = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "pom.xml" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $pom) {
            Write-Error "pom.xml NOT FOUND in current repository."
            exit 1
          }

          Write-Host "pom.xml found:"
          Write-Host $pom.FullName

      - name: Maven Clean Package
        shell: powershell
        run: |
          .\mvnw.cmd clean package

      - name: Run Maven Tests
        shell: powershell
        run: |
          .\mvnw.cmd test

      - name: Find Application JAR
        id: find_jar
        shell: powershell
        run: |
          $jar = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\target" `
            -Filter "*.jar" `
            -File |
            Where-Object {
              $_.Name -notlike "*-sources.jar" -and
              $_.Name -notlike "*-javadoc.jar" -and
              $_.Name -notlike "original-*"
            } |
            Select-Object -First 1

          if (-not $jar) {
            Write-Error "Application JAR not found in target folder."
            exit 1
          }

          Write-Host "Application JAR:"
          Write-Host $jar.FullName

          "jar=$($jar.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: ${{ steps.find_jar.outputs.jar }}
          if-no-files-found: error


  # =========================
  # DEV
  # =========================
  deploy-dev:
    name: Deploy DEV
    needs: build
    runs-on: [self-hosted, windows, x64]

    environment:
      name: dev

    steps:

      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: C:\Deploy\Dev

      - name: Deploy DEV
        shell: powershell
        run: |

          $deployPath = "C:\Apps\Dev"
          $port = 8081

          New-Item -ItemType Directory `
            -Force `
            -Path $deployPath | Out-Null

          # Stop application using port
          $connection = Get-NetTCPConnection `
            -LocalPort $port `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($connection) {

            $processId = $connection.OwningProcess

            Write-Host "Stopping process $processId on port $port"

            Stop-Process `
              -Id $processId `
              -Force `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 3
          }

          # Find downloaded JAR
          $jar = Get-ChildItem `
            "C:\Deploy\Dev" `
            -Filter "*.jar" |
            Select-Object -First 1

          if (-not $jar) {
            Write-Error "DEV JAR not found."
            exit 1
          }

          # Copy application
          Copy-Item `
            $jar.FullName `
            "$deployPath\application.jar" `
            -Force

          Write-Host "Starting DEV application..."

          Start-Process `
            "java.exe" `
            -ArgumentList "-jar `"$deployPath\application.jar`" --server.port=$port" `
            -WorkingDirectory $deployPath

          Start-Sleep -Seconds 15

      - name: DEV Health Check
        shell: powershell
        run: |

          $url = "http://localhost:8081"

          try {

            $response = Invoke-WebRequest `
              -Uri $url `
              -UseBasicParsing `
              -TimeoutSec 10

            Write-Host "DEV application is UP."
            Write-Host "HTTP Status: $($response.StatusCode)"

          }
          catch {

            Write-Error "DEV health check failed."
            exit 1
          }


  # =========================
  # QA
  # =========================
  deploy-qa:
    name: Deploy QA
    needs: deploy-dev
    runs-on: [self-hosted, windows, x64]

    environment:
      name: qa

    steps:

      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: C:\Deploy\QA

      - name: Deploy QA
        shell: powershell
        run: |

          $deployPath = "C:\Apps\QA"
          $port = 8082

          New-Item -ItemType Directory `
            -Force `
            -Path $deployPath | Out-Null

          $connection = Get-NetTCPConnection `
            -LocalPort $port `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($connection) {

            $processId = $connection.OwningProcess

            Write-Host "Stopping process $processId on port $port"

            Stop-Process `
              -Id $processId `
              -Force `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 3
          }

          $jar = Get-ChildItem `
            "C:\Deploy\QA" `
            -Filter "*.jar" |
            Select-Object -First 1

          if (-not $jar) {
            Write-Error "QA JAR not found."
            exit 1
          }

          Copy-Item `
            $jar.FullName `
            "$deployPath\application.jar" `
            -Force

          Write-Host "Starting QA application..."

          Start-Process `
            "java.exe" `
            -ArgumentList "-jar `"$deployPath\application.jar`" --server.port=$port" `
            -WorkingDirectory $deployPath

          Start-Sleep -Seconds 15

      - name: QA Health Check
        shell: powershell
        run: |

          $url = "http://localhost:8082"

          try {

            $response = Invoke-WebRequest `
              -Uri $url `
              -UseBasicParsing `
              -TimeoutSec 10

            Write-Host "QA application is UP."
            Write-Host "HTTP Status: $($response.StatusCode)"

          }
          catch {

            Write-Error "QA health check failed."
            exit 1
          }


  # =========================
  # PRODUCTION
  # =========================
  deploy-production:
    name: Deploy Production
    needs: deploy-qa
    runs-on: [self-hosted, windows, x64]

    environment:
      name: production

    steps:

      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: C:\Deploy\Production

      - name: Deploy Production
        shell: powershell
        run: |

          $deployPath = "C:\Apps\Prod"
          $port = 8083

          New-Item -ItemType Directory `
            -Force `
            -Path $deployPath | Out-Null

          $connection = Get-NetTCPConnection `
            -LocalPort $port `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($connection) {

            $processId = $connection.OwningProcess

            Write-Host "Stopping process $processId on port $port"

            Stop-Process `
              -Id $processId `
              -Force `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 3
          }

          $jar = Get-ChildItem `
            "C:\Deploy\Production" `
            -Filter "*.jar" |
            Select-Object -First 1

          if (-not $jar) {
            Write-Error "Production JAR not found."
            exit 1
          }

          Copy-Item `
            $jar.FullName `
            "$deployPath\application.jar" `
            -Force

          Write-Host "Starting Production application..."

          Start-Process `
            "java.exe" `
            -ArgumentList "-jar `"$deployPath\application.jar`" --server.port=$port" `
            -WorkingDirectory $deployPath

          Start-Sleep -Seconds 15

      - name: Production Health Check
        shell: powershell
        run: |

          $url = "http://localhost:8083"

          try {

            $response = Invoke-WebRequest `
              -Uri $url `
              -UseBasicParsing `
              -TimeoutSec 10

            Write-Host "Production application is UP."
            Write-Host "HTTP Status: $($response.StatusCode)"

          }
          catch {

            Write-Error "Production health check failed."
            exit 1
          }
```
