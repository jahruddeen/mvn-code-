name: Java Maven CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:

  # ============================================================
  # BUILD & TEST
  # ============================================================

  build:
    name: Build and Test
    runs-on: DESKTOP-OU1629A

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Java
        shell: powershell
        run: |
          java -version
          .\mvnw.cmd -version

      - name: Maven Clean Package
        shell: powershell
        run: |
          .\mvnw.cmd clean package

      - name: Find application JAR
        id: find_jar
        shell: powershell
        run: |

          $targetPath = "$env:GITHUB_WORKSPACE\target"

          Write-Host "Searching JAR in:"
          Write-Host $targetPath

          $jar = Get-ChildItem `
            -Path $targetPath `
            -Filter "*.jar" `
            -File |
            Where-Object {
              $_.Name -notlike "*-sources.jar" -and
              $_.Name -notlike "*-javadoc.jar" -and
              $_.Name -notlike "original-*"
            } |
            Select-Object -First 1

          if (-not $jar) {
            Write-Error "Application JAR not found."
            exit 1
          }

          Write-Host "Application JAR:"
          Write-Host $jar.FullName

          "jar=$($jar.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: ${{ steps.find_jar.outputs.jar }}
          if-no-files-found: error


  # ============================================================
  # DEV
  # ============================================================

  deploy-dev:
    name: Deploy DEV

    needs: build

    runs-on: [self-hosted, windows, x64]

    environment:
      name: dev

    steps:

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: C:\Deploy\Dev

      - name: Deploy DEV application
        shell: powershell
        run: |

          $deployPath = "C:\Apps\Dev"
          $artifactPath = "C:\Deploy\Dev"
          $port = 8081

          New-Item `
            -ItemType Directory `
            -Path $deployPath `
            -Force | Out-Null

          $jar = Get-ChildItem `
            -Path $artifactPath `
            -Filter "*.jar" `
            -File |
            Select-Object -First 1

          if (-not $jar) {
            throw "DEV JAR not found."
          }

          Write-Host "DEV JAR: $($jar.FullName)"

          # Stop existing application on port 8081
          $connections = Get-NetTCPConnection `
            -LocalPort $port `
            -State Listen `
            -ErrorAction SilentlyContinue

          foreach ($connection in $connections) {

            Write-Host "Stopping process PID: $($connection.OwningProcess)"

            Stop-Process `
              -Id $connection.OwningProcess `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Start-Sleep -Seconds 3

          # Copy new JAR
          Copy-Item `
            $jar.FullName `
            "$deployPath\application.jar" `
            -Force

          # Start application
          Start-Process `
            -FilePath "java.exe" `
            -ArgumentList "-jar `"$deployPath\application.jar`" --server.port=$port" `
            -WorkingDirectory $deployPath

          Start-Sleep -Seconds 15

      - name: Health check DEV
        shell: powershell
        run: |

          $url = "http://localhost:8081"

          try {

            $response = Invoke-WebRequest `
              -Uri $url `
              -UseBasicParsing `
              -TimeoutSec 20

            Write-Host "DEV HTTP Status: $($response.StatusCode)"

            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
              throw "DEV returned HTTP $($response.StatusCode)"
            }

          }
          catch {

            Write-Error "DEV health check failed."
            Write-Error $_
            exit 1
          }


  # ============================================================
  # QA
  # ============================================================

  deploy-qa:
    name: Deploy QA

    needs: deploy-dev

    runs-on: [self-hosted, windows, x64]

    environment:
      name: qa

    steps:

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: C:\Deploy\QA

      - name: Deploy QA application
        shell: powershell
        run: |

          $deployPath = "C:\Apps\QA"
          $artifactPath = "C:\Deploy\QA"
          $port = 8082

          New-Item `
            -ItemType Directory `
            -Path $deployPath `
            -Force | Out-Null

          $jar = Get-ChildItem `
            -Path $artifactPath `
            -Filter "*.jar" `
            -File |
            Select-Object -First 1

          if (-not $jar) {
            throw "QA JAR not found."
          }

          Write-Host "QA JAR: $($jar.FullName)"

          # Stop existing application on port 8082
          $connections = Get-NetTCPConnection `
            -LocalPort $port `
            -State Listen `
            -ErrorAction SilentlyContinue

          foreach ($connection in $connections) {

            Write-Host "Stopping process PID: $($connection.OwningProcess)"

            Stop-Process `
              -Id $connection.OwningProcess `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Start-Sleep -Seconds 3

          Copy-Item `
            $jar.FullName `
            "$deployPath\application.jar" `
            -Force

          Start-Process `
            -FilePath "java.exe" `
            -ArgumentList "-jar `"$deployPath\application.jar`" --server.port=$port" `
            -WorkingDirectory $deployPath

          Start-Sleep -Seconds 15

      - name: Health check QA
        shell: powershell
        run: |

          $url = "http://localhost:8082"

          try {

            $response = Invoke-WebRequest `
              -Uri $url `
              -UseBasicParsing `
              -TimeoutSec 20

            Write-Host "QA HTTP Status: $($response.StatusCode)"

            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
              throw "QA returned HTTP $($response.StatusCode)"
            }

          }
          catch {

            Write-Error "QA health check failed."
            Write-Error $_
            exit 1
          }


  # ============================================================
  # PRODUCTION
  # ============================================================

  deploy-production:
    name: Deploy Production

    needs: deploy-qa

    runs-on: [self-hosted, windows, x64]

    environment:
      name: production

    steps:

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: C:\Deploy\Prod

      - name: Deploy Production application
        shell: powershell
        run: |

          $deployPath = "C:\Apps\Prod"
          $artifactPath = "C:\Deploy\Prod"
          $port = 8083

          New-Item `
            -ItemType Directory `
            -Path $deployPath `
            -Force | Out-Null

          $jar = Get-ChildItem `
            -Path $artifactPath `
            -Filter "*.jar" `
            -File |
            Select-Object -First 1

          if (-not $jar) {
            throw "Production JAR not found."
          }

          Write-Host "Production JAR: $($jar.FullName)"

          # Stop existing application on port 8083
          $connections = Get-NetTCPConnection `
            -LocalPort $port `
            -State Listen `
            -ErrorAction SilentlyContinue

          foreach ($connection in $connections) {

            Write-Host "Stopping process PID: $($connection.OwningProcess)"

            Stop-Process `
              -Id $connection.OwningProcess `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Start-Sleep -Seconds 3

          Copy-Item `
            $jar.FullName `
            "$deployPath\application.jar" `
            -Force

          Start-Process `
            -FilePath "java.exe" `
            -ArgumentList "-jar `"$deployPath\application.jar`" --server.port=$port" `
            -WorkingDirectory $deployPath

          Start-Sleep -Seconds 20

      - name: Health check Production
        shell: powershell
        run: |

          $url = "http://localhost:8083"

          try {

            $response = Invoke-WebRequest `
              -Uri $url `
              -UseBasicParsing `
              -TimeoutSec 20

            Write-Host "Production HTTP Status: $($response.StatusCode)"

            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
              throw "Production returned HTTP $($response.StatusCode)"
            }

          }
          catch {

            Write-Error "Production health check failed."
            Write-Error $_
            exit 1
          }