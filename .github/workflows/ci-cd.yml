          $deployPath = "C:\Apps\QA"
          $jarPath = "C:\Deploy\QA"

          Write-Host "Preparing QA deployment..."

          New-Item `
            -ItemType Directory `
            -Path $deployPath `
            -Force | Out-Null

          $jar = Get-ChildItem `
            -Path $jarPath `
