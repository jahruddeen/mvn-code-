              -TimeoutSec 20

            Write-Host "Production HTTP Status: $($response.StatusCode)"

            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
              throw "Production returned HTTP status $($response.StatusCode)"
            }

          }
          catch {

            Write-Error "Production health check failed."
            Write-Error $_
            exit 1
          }