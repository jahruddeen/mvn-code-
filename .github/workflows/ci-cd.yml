name: Java Maven CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:

  # ============================================================
  # CI - BUILD & TEST
  # ============================================================

  build:
    name: Build and Test
    runs-on: [self-hosted, windows, x64]

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup Java
      # ----------------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # ----------------------------------------------------------
      # Verify Java
      # ----------------------------------------------------------

      - name: Verify Java
        shell: powershell
        run: |
          java -version
          .\mvnw.cmd -version

      # ----------------------------------------------------------
      # Build + Test
      # ----------------------------------------------------------

      - name: Maven Clean Package
        shell: powershell
        run: |
          .\mvnw.cmd clean package

      # ----------------------------------------------------------
      # Find JAR
      # ----------------------------------------------------------

      - name: Find application JAR
        id: find_jar
        shell: powershell
        run: |

          $targetPath = "$env:GITHUB_WORKSPACE\target"

          $jar = Get-ChildItem `
            -Path $targetPath `
            -Filter "*.jar" `
            -File |
            Where-Object {
              $_.Name -notlike "*-sources.jar" -and
              $_.Name -notlike "*-javadoc.jar" -and
              $_.Name -notlike "original-*"
            } |
            Select-Object -First 1

          if (-not $jar) {
            Write-Error "Application JAR not found in $targetPath"
            exit 1
          }

          Write-Host "Application JAR found:"
          Write-Host $jar.FullName

          "jar=$($jar.FullName)" >> $env:GITHUB_OUTPUT

      # ----------------------------------------------------------
      # Upload artifact
      # ----------------------------------------------------------

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: ${{ steps.find_jar.outputs.jar }}
          if-no-files-found: error


  # ============================================================
  # DEV DEPLOYMENT
  # ============================================================

  deploy-dev:

    name: Deploy DEV

    needs: build

    runs-on: [self-hosted, windows, x64]

    environment:
      name: dev

    steps:

      # ----------------------------------------------------------
      # Download Artifact
      # ----------------------------------------------------------

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: C:\Deploy\Dev

      # ----------------------------------------------------------
      # Deploy DEV
      # ----------------------------------------------------------

      - name: Deploy DEV application
        shell: powershell
        run: |

          $deployPath = "C:\Apps\Dev"
          $jarPath = "C:\Deploy\Dev"

          Write-Host "Preparing DEV deployment..."

          New-Item `
            -ItemType Directory `
            -Path $deployPath `
            -Force | Out-Null

          $jar = Get-ChildItem `
            -Path $jarPath `
            -Filter "*.jar" `
            -File |
            Select-Object -First 1

          if (-not $jar) {
            throw "DEV JAR not found in $jarPath"
          }

          Write-Host "JAR: $($jar.FullName)"

          # Stop application using port 8081
          $connections = Get-NetTCPConnection `
            -LocalPort 8081 `
            -State Listen `
            -ErrorAction SilentlyContinue

          foreach ($connection in $connections) {

            $process = Get-Process `
              -Id $connection.OwningProcess `
              -ErrorAction SilentlyContinue

            if ($process) {
              Write-Host "Stopping DEV process PID: $($process.Id)"
              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }

          Start-Sleep -Seconds 3

          # Copy new JAR
          Copy-Item `
            $jar.FullName `
            "$deployPath\application.jar" `
            -Force

          Write-Host "Starting DEV application..."

          Start-Process `
            -FilePath "java.exe" `
            -ArgumentList @(
              "-jar",
              "$deployPath\application.jar",
              "--server.port=8081"
            ) `
            -WorkingDirectory $deployPath

          Start-Sleep -Seconds 15

      # ----------------------------------------------------------
      # DEV Health Check
      # ----------------------------------------------------------

      - name: Health check DEV
        shell: powershell
        run: |

          $url = "http://localhost:8081"

          try {

            $response = Invoke-WebRequest `
              -Uri $url `
              -UseBasicParsing `
              -TimeoutSec 20

            Write-Host "DEV HTTP Status: $($response.StatusCode)"

            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
              throw "DEV returned HTTP status $($response.StatusCode)"
            }

          }
          catch {

            Write-Error "DEV health check failed."
            Write-Error $_
            exit 1
          }


  # ============================================================
  # QA DEPLOYMENT
  # ============================================================

  deploy-qa:

    name: Deploy QA

    needs: deploy-dev

    runs-on: [self-hosted, windows, x64]

    environment:
      name: qa

    steps:

      # ----------------------------------------------------------
      # Download Artifact
      # ----------------------------------------------------------

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: C:\Deploy\QA

      # ----------------------------------------------------------
      # Deploy QA
      # ----------------------------------------------------------

      - name: Deploy QA application
        shell: powershell
