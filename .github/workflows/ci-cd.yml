            -ArgumentList @(
              "-jar",
              "$deployPath\application.jar",
              "--server.port=8083"
            ) `
            -WorkingDirectory $deployPath

          Start-Sleep -Seconds 20

      # ----------------------------------------------------------
      # Production Health Check
      # ----------------------------------------------------------

      - name: Health check Production
        shell: powershell
        run: |

          $url = "http://localhost:8083"

          try {

            $response = Invoke-WebRequest `
              -Uri $url `
