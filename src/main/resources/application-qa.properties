# ============================================================
# QA Application Configuration
# ============================================================

# Server Configuration
server.port=8082
server.servlet.context-path=/app
server.error.include-message=always
server.error.include-stacktrace=always

# Application Name and Logging
spring.application.name=java-project
logging.level.root=INFO
logging.level.com.example=DEBUG

# Database Configuration (QA)
spring.datasource.url=jdbc:mysql://qa-db-server:3306/qa_database
spring.datasource.username=qa_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Health Check
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Actuator Configuration
management.health.defaults.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true

# Cache Configuration (QA)
spring.cache.type=simple

# Application Profile
app.environment=qa
app.debug.enabled=true